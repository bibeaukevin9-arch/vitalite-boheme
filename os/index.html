<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vérifier les os — Vitalité Bohème</title>
<style>
  :root { --papier:#D6D2C8; --encre:#2b2520; --doux:#6b6155; --trait:#c4bcae; --vert:#3f6e3c; --rouge:#a8402c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --papier:#20201d; --encre:#e8e2d6; --doux:#9d9484; --trait:#3c3a34; --vert:#6f9a6b; --rouge:#c4684f; } }
  :root[data-theme="dark"] { --papier:#20201d; --encre:#e8e2d6; --doux:#9d9484; --trait:#3c3a34; --vert:#6f9a6b; --rouge:#c4684f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papier); color: var(--encre);
         font-family: Georgia, 'Times New Roman', serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 16px 40px; }
  .haut { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .compte { color: var(--doux); font-size: 14px; }
  h1 { font-weight: 400; font-size: clamp(24px, 6vw, 32px); margin: 6px 0 0; }
  .ancien { color: var(--doux); margin: 2px 0 10px; min-height: 1.2em; }
  iframe { width: 100%; height: min(62vh, 620px); border: 1px solid var(--trait); border-radius: 6px;
           background: #D6D2C8; display: block; }
  .verdict { display: flex; gap: 10px; margin: 14px 0 10px; }
  .verdict button { flex: 1; font: inherit; font-size: 18px; min-height: 56px; border-radius: 8px; cursor: pointer;
                    border: 2px solid var(--trait); background: transparent; color: var(--encre); }
  .verdict button[data-v="ok"][aria-pressed="true"]  { background: var(--vert); border-color: var(--vert); color: #fff; }
  .verdict button[data-v="non"][aria-pressed="true"] { background: var(--rouge); border-color: var(--rouge); color: #fff; }
  .nav { display: flex; gap: 10px; }
  .nav button { flex: 1; font: inherit; font-size: 15px; min-height: 46px; border-radius: 8px; cursor: pointer;
                border: 1px solid var(--trait); background: transparent; color: var(--encre); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .envoyer { width: 100%; margin-top: 18px; font: inherit; font-size: 16px; min-height: 50px; border-radius: 8px;
             border: 0; background: var(--encre); color: var(--papier); cursor: pointer; }
  footer { margin-top: 22px; font-size: 13px; color: var(--doux); }
</style>
</head>
<body>
<main>
  <div class="haut"><span class="compte" id="position"></span><span class="compte" id="compte"></span></div>
  <h1 id="nom"></h1>
  <p class="ancien" id="ancien"></p>
  <iframe id="vue" title="L'os en 3D"></iframe>
  <div class="verdict">
    <button data-v="ok">✓ Correct</button>
    <button data-v="non">✗ Pas correct</button>
  </div>
  <div class="nav">
    <button id="precedent">← Précédent</button>
    <button id="suivant">Suivant →</button>
  </div>
  <button class="envoyer" id="envoyer">Envoyer mon tri à Kevin</button>
  <footer>Modèles : BodyParts3D, © The Database Center for Life Science, licence CC BY 4.0. Vitalité Bohème.</footer>
</main>
<script>
const OS = [{"id": "01_atlas", "nom": "Atlas (C1)", "ancien": "", "poids": 0.2}, {"id": "02_axis", "nom": "Axis (C2)", "ancien": "", "poids": 0.3}, {"id": "03_cartilages-costaux", "nom": "Cartilages costaux", "ancien": "", "poids": 2.1}, {"id": "04_clavicule", "nom": "Clavicule", "ancien": "", "poids": 0.2}, {"id": "05_cotes", "nom": "Côtes", "ancien": "", "poids": 24.2}, {"id": "06_crane", "nom": "Crâne", "ancien": "", "poids": 7.0}, {"id": "07_femur", "nom": "Fémur", "ancien": "", "poids": 0.4}, {"id": "08_fibula", "nom": "Fibula", "ancien": "péroné", "poids": 0.2}, {"id": "09_humerus", "nom": "Humérus", "ancien": "", "poids": 0.5}, {"id": "10_hyoide", "nom": "Os hyoïde", "ancien": "", "poids": 0.2}, {"id": "11_mandibule", "nom": "Mandibule", "ancien": "maxillaire inférieur", "poids": 0.7}, {"id": "12_metacarpiens-et-doigts", "nom": "Métacarpiens et phalanges de la main", "ancien": "", "poids": 1.8}, {"id": "13_metatarsiens-et-orteils", "nom": "Métatarsiens et phalanges du pied", "ancien": "", "poids": 2.0}, {"id": "14_os-coxal", "nom": "Os coxal", "ancien": "os iliaque", "poids": 0.3}, {"id": "15_os-du-carpe", "nom": "Os du carpe", "ancien": "", "poids": 0.5}, {"id": "16_os-du-tarse", "nom": "Os du tarse", "ancien": "", "poids": 1.8}, {"id": "17_patella", "nom": "Patella", "ancien": "rotule", "poids": 0.1}, {"id": "18_radius", "nom": "Radius", "ancien": "", "poids": 0.1}, {"id": "19_scapula", "nom": "Scapula", "ancien": "omoplate", "poids": 3.6}, {"id": "20_sternum", "nom": "Sternum", "ancien": "", "poids": 1.2}, {"id": "21_tibia", "nom": "Tibia", "ancien": "", "poids": 0.2}, {"id": "22_ulna", "nom": "Ulna", "ancien": "cubitus", "poids": 0.1}, {"id": "23_vertebres-cervicales", "nom": "Vertèbres cervicales (C3 à C7)", "ancien": "", "poids": 1.4}, {"id": "24_vertebres-lombaires", "nom": "Vertèbres lombaires (L1 à L5)", "ancien": "", "poids": 4.5}, {"id": "25_vertebres-thoraciques", "nom": "Vertèbres thoraciques (T1 à T12)", "ancien": "vertèbres dorsales", "poids": 6.5}];
const CLE = "vb-os-tri-v1";
let tri = {};
try { tri = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) { tri = {}; }
let i = Math.max(0, OS.findIndex((o) => !tri[o.id]));
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(tri)); } catch (e) {} }
function afficher() {
  const o = OS[i];
  document.getElementById("nom").textContent = o.nom;
  document.getElementById("ancien").textContent = o.ancien ? "autrefois : " + o.ancien : "";
  document.getElementById("vue").src = o.id + ".html";
  document.querySelectorAll(".verdict button").forEach((b) => b.setAttribute("aria-pressed", String(tri[o.id] === b.dataset.v)));
  document.getElementById("position").textContent = "Os " + (i + 1) + " sur " + OS.length;
  const ok = OS.filter((x) => tri[x.id] === "ok").length, non = OS.filter((x) => tri[x.id] === "non").length;
  document.getElementById("compte").textContent = ok + " corrects · " + non + " pas corrects";
  document.getElementById("precedent").disabled = i === 0;
  document.getElementById("suivant").disabled = i === OS.length - 1;
}
document.querySelectorAll(".verdict button").forEach((b) => b.addEventListener("click", () => {
  tri[OS[i].id] = b.dataset.v;
  sauver();
  if (i < OS.length - 1) i++;
  afficher();
  window.scrollTo(0, 0);
}));
document.getElementById("precedent").addEventListener("click", () => { if (i > 0) { i--; afficher(); } });
document.getElementById("suivant").addEventListener("click", () => { if (i < OS.length - 1) { i++; afficher(); } });
document.getElementById("envoyer").addEventListener("click", () => {
  const non = OS.filter((o) => tri[o.id] === "non").map((o) => "- " + o.nom);
  const ok = OS.filter((o) => tri[o.id] === "ok").length;
  const NL = String.fromCharCode(10);
  const corps = ["Tri des os", "", ok + " corrects.", "", "Pas corrects :"].concat(non.length ? non : ["aucun"]).join(NL);
  location.href = "mailto:bibeaukevin9@gmail.com?subject=" + encodeURIComponent("Tri des os") +
    "&body=" + encodeURIComponent(corps);
});
afficher();
</script>
</body>
</html>
